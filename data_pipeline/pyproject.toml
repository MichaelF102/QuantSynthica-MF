[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsmf-data-pipeline"
version = "0.1.0"
description = "QuantSynthica Mutual Funds data ingestion (pure Python, no DB dependency)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["data_pipeline*"]
