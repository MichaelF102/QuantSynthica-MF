services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qsmf
      POSTGRES_PASSWORD: qsmf
      POSTGRES_DB: qsmf
    ports: ["${QSMF_PG_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsmf -d qsmf"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["${QSMF_REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      QSMF_DATABASE_URL: postgresql+psycopg://qsmf:qsmf@postgres:5432/qsmf
      QSMF_REDIS_URL: redis://redis:6379/0
      QSMF_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
