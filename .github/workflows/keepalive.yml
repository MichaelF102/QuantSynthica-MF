name: keepalive
# Render's free web service sleeps after 15 idle minutes and takes 30 to 60 s to wake. This pings it every 10 minutes so visitors rarely wait.
# One always-on free service fits inside Render's 750 free hours a month. Needs one repository VARIABLE (Settings > Secrets and variables >
# Actions > Variables): API_URL = https://<your-service>.onrender.com . Without it the job does nothing.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it from the Actions tab.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL variable not set; nothing to do"; exit 0; fi
          curl -fsS --max-time 90 --retry 2 "$API_URL/api/v1/health"
