[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsmf-quant-engine"
version = "0.1.0"
description = "QuantSynthica quantitative research engine (no web, DB or UI dependencies)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
# Needed only by the offline research build (clustering, regimes); the API serves stored results and does not import them.
research = ["scikit-learn>=1.4", "hmmlearn>=0.3"]
dev = ["pytest>=8", "scikit-learn>=1.4", "hmmlearn>=0.3"]

[tool.setuptools.packages.find]
include = ["quant_engine*"]
