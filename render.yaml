# Render Blueprint for the FREE plan: one web service, no disk, no cron, no Render Postgres.
# You are asked for ONE value: QSMF_DATABASE_URL (a free Neon or Supabase database; Render's own free Postgres is deleted after 30 days).
# Everything else is set here:
#   - Data: no persistent disk, so the NAV store is downloaded at build time from the repo's GitHub release `data-latest`
#     (scripts/fetch_data.sh works the URL out from RENDER_GIT_REPO_SLUG; set QSMF_DATA_URL only to use another host).
#   - CORS: any https://*.vercel.app origin is allowed, so the Vercel site needs no extra setup.
#     (Custom domain? Add it as QSMF_CORS_ORIGINS='["https://your.domain"]'.)
# Memory: measured peak about 330 MB under 15 concurrent heavy requests (limit 512 MB). Details in docs/deployment.md.
# NOT yet applied to a real Render account.
services:
  - type: web
    name: qsmf-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install ./data_pipeline[parquet] ./quant_engine ./backend && scripts/fetch_data.sh
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: QSMF_ENVIRONMENT
        value: production
      - key: QSMF_ENABLE_BACKTESTS
        value: "false"          # a new backtest needs about 1 GB; stored results are still served
      # Return freed memory to the OS instead of hoarding it (this alone cut the peak from about 520 MB to about 260 MB):
      - key: ARROW_DEFAULT_MEMORY_POOL
        value: system
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: QSMF_DATABASE_URL
        sync: false             # the only value you must provide: the Neon/Supabase connection string
      - key: QSMF_CORS_ORIGINS
        value: "[]"
      - key: QSMF_CORS_ORIGIN_REGEX
        value: '^https://[a-z0-9-]+\.vercel\.app$'
